[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kgml-new"
version = "0.1.0"
description = "PyTorch Geometric GraphSAGE and edge-aware semantic GraphSAGE (no Kedro)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "pandas>=2.0",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
semantic = ["openai>=1.0", "google-genai>=1.0.0", "python-dotenv>=1.0"]
tuning = ["optuna>=3.0"]
viz = ["umap-learn>=0.5", "matplotlib>=3.7", "pyyaml>=6.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "optuna>=3.0"]
# HGT LinkNeighborLoader (after CUDA torch): torch_scatter + torch_sparse from PyG wheels (same torch+cuda tag).
# Omit pyg_lib on RHEL8/glibc<2.29 unless you build from source — see scripts/bootstrap_gpu_venv.sh

[project.scripts]
kgml-new-link-pred = "kgml_new.scripts.run_link_prediction:main"
kgml-new-node-cls = "kgml_new.scripts.run_node_classification:main"
kgml-new-txgnn = "kgml_new.scripts.run_txgnn:main"
kgml-new-hgt = "kgml_new.scripts.run_hgt:main"
kgml-new-build-node-caches = "kgml_new.scripts.build_node_embedding_caches:main"
kgml-new-plot-curves = "kgml_new.scripts.plot_training_curves:main"
kgml-new-loss-figures-primekg-fb15k = "kgml_new.scripts.make_primekg_fb15k_loss_figures:main"
kgml-new-umap-compare = "kgml_new.scripts.umap_compare_methods:main"
kgml-new-export-hgt-embeddings = "kgml_new.scripts.export_hgt_embeddings:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
